name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Go backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: ./scripts/prepare-frontend.sh
      - run: node scripts/profile-writing.mjs
      - run: go vet . ./internal/... ./cmd/...
      - run: ./scripts/check-go-coverage.sh
      - run: go test -race . ./internal/... ./cmd/...

  backend-platform:
    name: Go platform contracts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - run: go test . ./internal/... ./cmd/...
      - name: Test embedded Vale on the native platform
        working-directory: third_party/vale
        run: go test ./...

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: ./scripts/prepare-frontend.sh
      - run: npm run lint
      - run: npm run test:coverage

  browser:
    name: Browser export test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: ./scripts/prepare-frontend.sh
      - run: npx playwright install --with-deps chromium
      - name: Exercise the application Chromium PDF process
        # Only this trusted fixture browser runs without a sandbox in the
        # disposable Ubuntu runner; packaged application arguments are unchanged.
        env:
          FIGARO_BROWSER_PDF_ARGUMENTS: --no-sandbox
        shell: bash
        run: |
          browser_executable="$(node --input-type=module -e \
            "import { chromium } from 'playwright'; process.stdout.write(chromium.executablePath())")"
          FIGARO_BROWSER_PDF_EXECUTABLE="$browser_executable" \
            go test -v ./internal/pdfexport -run '^TestRenderChromiumPDFAgainstOptInBrowser$'
      - run: npm run test:pdf
      - name: Upload Playwright failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-ci-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest .
