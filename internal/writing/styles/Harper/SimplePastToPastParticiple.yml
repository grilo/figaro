  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))sang\b': "sung"
  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))sank\b': "sunk"
  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))shook\b': "shaken"
  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))shrank\b': "shrunk"
  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))sprang\b': "sprung"
