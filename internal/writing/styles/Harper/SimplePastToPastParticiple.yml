  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))tore\b': "torn"
  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))went\b': "gone"
  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))wore\b': "worn"
  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))wove\b': "woven"
  '(?<=(?i:\b(?:have|has|had|having)\s|[''’]ve\s))wrote\b': "written"
